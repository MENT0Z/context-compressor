<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Top bar -->
    <div class="topbar">
        <h2>LLM Extractor</h2>
        <button id="historyBtn" class="icon-btn" title="History" aria-label="View history">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
        </button>
    </div>

    <!-- Main view -->
    <div id="mainView">
        <!-- API Key -->
        <div class="key-section">
            <input type="password" id="apiKey" placeholder="Paste Gemini API key…">
            <button id="saveKey">Save</button>
            <span id="keySaved" class="badge hidden">✓</span>
        </div>

        <!-- Actions -->
        <div class="btn-row">
            <button id="extract">① Extract</button>
            <button id="process" disabled>② Process</button>
        </div>

        <!-- Status -->
        <div id="status" class="status hidden"></div>

        <!-- Results -->
        <div id="resultArea" class="hidden">

            <!-- Copy button -->
            <div class="result-header">
                <span class="result-label">Result</span>
                <button id="copyBtn" class="copy-btn" title="Copy to clipboard">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    Copy
                </button>
            </div>

            <!-- Accordion sections -->
            <div id="accordion"></div>

        </div>
    </div>

    <!-- History view -->
    <div id="historyView" class="hidden">
        <div class="history-header">
            <button id="backBtn" class="icon-btn" aria-label="Back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="15 18 9 12 15 6"/>
                </svg>
            </button>
            <span class="history-title">History</span>
            <button id="clearHistory" class="text-btn danger">Clear all</button>
        </div>
        <div id="historyList"></div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
